<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLEN — Your workspace begins with your idea</title>
  <meta name="description" content="SOLEN turns ideas into living workspaces. No dashboards. No templates. Your workspace grows from what you need, when you need it.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="SOLEN — Your workspace begins with your idea">
  <meta property="og:description" content="SOLEN turns ideas into living workspaces. Your workspace grows from what you need, when you need it.">
  <meta property="og:image" content="./og-image.png">
  <meta property="og:url" content="https://solen.dev">
  <meta property="og:type" content="website">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SOLEN">
  <meta name="twitter:description" content="Your workspace begins with your idea.">
  <meta name="twitter:image" content="./twitter-card.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --eclipse: #0F1115;
      --surface: #1A1A1A;
      --amber: #F59E0B;
      --text: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #52525b;
    }
    
    body {
      background: var(--eclipse);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }
    
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1s ease-out both;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .mark {
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-out 0.2s both;
    }
    
    .mark svg {
      width: 80px;
      height: 80px;
    }
    
    .wordmark {
      font-size: 36px;
      font-weight: 200;
      color: var(--text);
      letter-spacing: 0.3em;
      margin-bottom: 0.75rem;
      animation: fadeIn 1s ease-out 0.4s both;
    }
    
    .accent-line {
      width: 40px;
      height: 1px;
      background: var(--amber);
      margin: 0 auto 2rem;
      animation: fadeIn 1s ease-out 0.5s both;
    }
    
    .tagline {
      font-size: 17px;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeIn 1s ease-out 0.6s both;
    }
    
    .description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 3rem;
      animation: fadeIn 1s ease-out 0.7s both;
    }
    
    .links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      animation: fadeIn 1s ease-out 0.8s both;
    }
    
    .links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      transition: color 0.3s;
      border-bottom: 1px solid transparent;
    }
    
    .links a:hover {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }
    
    .status {
      margin-top: 3rem;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      animation: fadeIn 1s ease-out 0.9s both;
    }
    
    .status span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--amber);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- SOLEN Master Logo v1.0 -->
    <div class="mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-label="SOLEN logo">
        <rect x="0" y="0" width="128" height="128" rx="28" fill="#1A1A1A"/>
        <path d="M 38 64 A 26 26 0 1 1 90 64" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="64" cy="52" r="5" fill="#F59E0B"/>
      </svg>
    </div>
    
    <h1 class="wordmark">SOLEN</h1>
    <div class="accent-line"></div>
    
    <p class="tagline">
      Your workspace begins with your idea.
    </p>
    
    <p class="description">
      SOLEN turns ideas into living workspaces.<br>
      You start with a dream project. SOLEN listens.<br>
      Your workspace grows from what you need,<br>
      when you need it. Nothing more. Nothing less.
    </p>
    
    <nav class="links">
      <a href="https://github.com/solenhq">GitHub</a>
      <a href="mailto:hello.solenhq@gmail.com">hello.solenhq@gmail.com</a>
      <a href="https://x.com/solenhq">X</a>
    </nav>
    
    <div class="status">
      <span></span>Building in public
    </div>
  </main>
  
  <footer>SOLEN &copy; 2026</footer>
</body>
</html>
