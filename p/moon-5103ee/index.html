function showTrash(){
  const t = S.trash = validTrash(S.trash);
  basket.classList.toggle('full', !!t);
  oops.hidden = !t || !ask.hidden;
}
const sheetKeys = id => Object.keys(S.f).filter(k => k.startsWith(id + '.'));
// what the basket throws away: the whole sheet, or (on a sheet with tabs) the page in front, e.g. {id:'debts.3'}
const scopeOf = sh => (PAPER.scope && PAPER.scope(sh)) || {id:sh.dataset.sheet, label:sh.dataset.label};
function wiggle(){
  if (!REDUCED) basket.animate([{transform:'rotate(0)'}, {transform:'rotate(-8deg)'}, {transform:'rotate(6deg)'}, {transform:'rotate(-2deg)'}, {transform:'rotate(0)'}],
    {duration:420, easing:'ease-out'});
}

function crinkle(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const sr = actx.sampleRate, len = Math.floor(sr * .85), buf = actx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    let i = 0;
    while (i < len){
      const burst = Math.floor((Math.random() * .012 + .002) * sr), amp = (Math.random() * .8 + .2) * Math.sin(Math.PI * i / len);
      for (let j = 0; j < burst && i + j < len; j++) d[i + j] = (Math.random() * 2 - 1) * amp * Math.exp(-j / (burst * .3));
      i += burst + Math.floor(Math.random() * .028 * sr);
    }
    const src = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; hp.type = 'highpass'; hp.frequency.value = 1400; g.gain.value = .2;
    src.connect(hp).connect(g).connect(actx.destination); src.start();
  } catch (e) {}
}

function ballSVG(tint){
  const r = Math.random, n = 15, P = [], I = [], id = 'bs' + (++uid);
  for (let i = 0; i < n; i++){
    const a = (i + (r() - .5) * .5) / n * Math.PI * 2, rr = 41 + r() * 7 - (i % 2) * 3.5;
    P.push([50 + Math.cos(a) * rr, 50 + Math.sin(a) * rr]);
  }
  for (let k = 0; k < 6; k++){ const a = r() * Math.PI * 2, rr = r() * 24; I.push([50 + Math.cos(a) * rr, 50 + Math.sin(a) * rr]); }
  const pt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const near = q => I.reduce((b, p) => Math.hypot(p[0] - q[0], p[1] - q[1]) < Math.hypot(b[0] - q[0], b[1] - q[1]) ? p : b, I[0]);
  const shade = () => ['#FFFEFA', '#F7F5ED', '#EDEADF', '#E2DED2', '#D7D2C5'][(r() * 5) | 0];
  let out = `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="${id}" cx="36%" cy="30%" r="78%">` +
    `<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2A2A20" stop-opacity=".3"/></radialGradient></defs>` +
    `<polygon points="${P.map(pt).join(' ')}" fill="#FBFAF4" stroke="#C9C4B6" stroke-width="1"/>`;
  for (let i = 0; i < n; i++){
    const a = P[i], b = P[(i + 1) % n];
    out += `<polygon points="${pt(a)} ${pt(b)} ${pt(near([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]))}" fill="${shade()}"/>`;
  }
  for (let k = 0; k < 5; k++) out += `<polygon points="${pt(I[k])} ${pt(I[(k + 1) % 6])} ${pt(I[(k + 3) % 6])}" fill="${shade()}" opacity=".8"/>`;
  for (let k = 0; k < 10; k++){
    const a = I[(r() * 6) | 0], b = P[(r() * n) | 0];
    out += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#463F2E" stroke-opacity=".24" stroke-width=".8"/>`;
  }
  const inks = ['#2B5A8C', '#9AAAC0'].concat(tint || []);
  for (let k = 0; k < 6; k++){
    const a = I[(r() * 6) | 0], ang = r() * Math.PI, len = 6 + r() * 10, c = inks[k % inks.length];
    out += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${(a[0] + Math.cos(ang) * len).toFixed(1)}" y2="${(a[1] + Math.sin(ang) * len).toFixed(1)}" ` +
      `stroke="${c}" stroke-width="${k < 2 ? 1.2 : 2.2}" opacity=".6" stroke-linecap="round"/>`;
  }
  return out + `<polygon points="${P.map(pt).join(' ')}" fill="url(#${id})"/></svg>`;
}

function creases(w, hh){
  const r = Math.random;
  let out = `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true">`;
  for (let k = 0; k < 16; k++){
    const x = r() * w, y = r() * hh, a = r() * Math.PI * 2, l = (.25 + r() * .4) * Math.max(w, hh);
    const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l, x3 = x + Math.cos(a + 1.1) * l * .7, y3 = y + Math.sin(a + 1.1) * l * .7;
    out += `<polygon points="${x},${y} ${x2},${y2} ${x3},${y3}" fill="${k % 2 ? '#ffffff' : '#142033'}" opacity="${k % 2 ? .42 : .1}"/>`;
  }
  for (let k = 0; k < 22; k++){
    const x = r() * w, y = r() * hh, a = r() * Math.PI, l = (.3 + r() * .7) * Math.max(w, hh);
    const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l;
    out += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#142033" stroke-opacity=".24" stroke-width="1.3"/>` +
      `<line x1="${x + 1.3}" y1="${y + 1.3}" x2="${x2 + 1.3}" y2="${y2 + 1.3}" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.1"/>`;
  }
  return out + `<rect width="100%" height="100%" fill="url(#crShade)"/></svg>`;
}

// geometry of the visible part of a sheet, and the keyframes that fold it into a ball
// (transform and clip-path run as two effects, so the transform can stay on the compositor)
function fold(sheetEl){
  const r = sheetEl.getBoundingClientRect();
  const y0 = Math.max(0, -r.top), y1 = Math.min(r.height, innerHeight - r.top);
  const w = r.width, hh = Math.max(40, y1 - y0), cx = w / 2, cy = y0 + hh / 2;
  const N = 32, per = 2 * (w + hh), P = [];
  for (let i = 0; i < N; i++){
    let d = per * i / N, x, y;
    if (d < w){ x = d; y = y0; }
    else if ((d -= w) < hh){ x = w; y = y0 + d; }
    else if ((d -= hh) < w){ x = w - d; y = y0 + hh; }
    else { d -= w; x = 0; y = y0 + hh - d; }
    P.push([x, y]);
  }
  const R = Math.min(w, hh) * .4, rnd = Math.random;
  // a lumpy round outline (a few dents), not a star
  const end = P.map(([x, y], i) => {
    const a = Math.atan2(y - cy, x - cx), rr = R * (i % 5 === 0 ? .78 : .9 + rnd() * .12);
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });
  // halfway: edges pulled in unevenly, like a sheet squeezed from both sides
  const mid = P.map(([x, y], i) => {
    const t = .42 + rnd() * .22;
    return [x + (end[i][0] - x) * t + (rnd() - .5) * w * .12, y + (end[i][1] - y) * t + (rnd() - .5) * hh * .09];
  });
  const poly = pts => 'polygon(' + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',') + ')';
  const BALL = Math.round(Math.max(70, Math.min(104, w * .26)));
  const sc = BALL / (2 * R * .93), rot = (rnd() < .5 ? -1 : 1) * (16 + rnd() * 16), tilt = rnd() < .5 ? -1 : 1;
  const tf = (o, ty, sz, rx, ry, rz) => ({offset:o,
    transform:`perspective(1100px) translateY(${ty}px) scale(${sz.toFixed(3)}) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${rz.toFixed(1)}deg)`});
  const cf = (o, pts) => ({offset:o, clipPath:poly(pts), webkitClipPath:poly(pts)});
  return {
    w, y0, hh, cx, cy, BALL, center:[r.left + cx, r.top + cy],
    tf:[tf(0, 0, 1, 0, 0, 0), tf(.16, -8, .985, 2, -2 * tilt, -.6), tf(.55, -4, .45 + sc * .55, 16, -20 * tilt, rot * .35),
      tf(1, 0, sc, 8, -10 * tilt, rot)],
    cf:[cf(0, P), cf(.16, P), cf(.55, mid), cf(1, end)]
  };
}
// wait for animations, but never longer than their length plus a margin: a throttled or background tab
// must not leave a page half thrown away
const settle = (anims, ms) => Promise.race([Promise.all([].concat(anims).map(a => a.finished.catch(() => {}))),
  new Promise(r => setTimeout(r, ms + 350))]);
const reverse = frames => frames.slice().reverse().map(f => ({...f, offset:1 - f.offset}));
function addCreases(sheetEl, g){
  const c = h('div', {class:'creases'});
  c.style.top = g.y0 + 'px'; c.style.width = g.w + 'px'; c.style.height = g.hh + 'px';
  c.innerHTML = creases(Math.round(g.w), Math.round(g.hh));
  sheetEl.append(c);
  return c;
}
function makeBall(D, at, tint){
  const b = h('div', {class:'ball'});
  b.innerHTML = ballSVG(tint);
  b.style.width = b.style.height = D + 'px';
  b.style.left = (at[0] - D / 2) + 'px'; b.style.top = (at[1] - D / 2) + 'px';
  fx.append(b);
  return b;
}
function arc(from, to, spin){
  const H = Math.max(90, Math.abs(to[0] - from[0]) * .35 + 70), out = [];
  for (let i = 0; i <= 14; i++){
    const t = i / 14, x = (to[0] - from[0]) * t, y = (to[1] - from[1]) * t - H * 4 * t * (1 - t);
    out.push({transform:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(t * spin).toFixed(0)}deg) scale(${(1 - .45 * t).toFixed(3)})`});
  }
  return out;
}
function binMouth(){ const b = basket.querySelector('svg').getBoundingClientRect(); return [b.left + b.width * .5, b.top + b.height * .28]; }
const tintOf = saved => [...new Set(Object.values(saved).filter(v => typeof v === 'string' && PENCILS.some(p => p.id === v)))].slice(0, 2).map(id => pencil(id).c);

// first tap lifts the page and asks; a second tap on the basket within 4 s throws it away
function arm(sh){
  disarm();
  closeFan(false);
  const sc = scopeOf(sh);
  if (!sheetKeys(sc.id).length){ wiggle(); showAsk('This page is already blank', 1800); say('This page is already blank'); return; }
  const lift = REDUCED ? null : sh.animate([{transform:'none'}, {transform:'translateY(-6px) rotate(-.35deg)'}],
    {duration:220, easing:'ease-out', fill:'forwards'});
  sh.classList.add('busy');
  armed = {sheet:sh, lift, y:scrollY, t:setTimeout(disarm, 4000)};
  // a page behind a tab is named, and what else goes (or stays) is said on the note itself, not only to screen readers
  showAsk((sc.id !== sh.dataset.sheet ? `Toss ${sc.label}?` : 'Toss this page?') + ' Tap the basket again' + (sc.note ? '\n' + sc.note : ''));
  say(`Toss the ${sc.label} page? Press the basket again to throw it away.` + (sc.note ? ' ' + sc.note : ''));
}
function disarm(){
  if (!armed) return;
  const a = armed; armed = null; clearTimeout(a.t);
  if (a.lift) a.lift.cancel();
  if (!busy) a.sheet.classList.remove('busy');
  hideAsk();
}
document.addEventListener('pointerdown', e => { if (armed && !basket.contains(e.target)) disarm(); }, true);
addEventListener('scroll', () => { if (armed && Math.abs(scrollY - armed.y) > 60) disarm(); }, {passive:true});
basket.addEventListener('click', () => {
  if (busy) return;
  const sh = currentSheet();
  if (armed && armed.sheet === sh){ const a = armed; armed = null; clearTimeout(a.t); hideAsk(); toss(sh, a.lift); }
  else arm(sh);
});

async function toss(sh, lift){
  busy = true;
  const {id, label} = scopeOf(sh);
  if (document.activeElement && sh.contains(document.activeElement)) document.activeElement.blur();
  const saved = {};
  sheetKeys(id).forEach(k => { saved[k] = S.f[k]; delete S.f[k]; });
  S.trash = {id, saved, at:Date.now()};       // kept until she writes on that page again, tosses another, or a day passes
  dirty = true; persist();
  sh.inert = true;
  let ball = null, c = null;
  try {
    try { navigator.vibrate && navigator.vibrate([10, 40, 10]); } catch (e) {}
    if (REDUCED){
      await settle(sh.animate([{opacity:1}, {opacity:0}], {duration:200, fill:'forwards'}), 200);
      paintAll();
      sh.getAnimations().forEach(a => a.cancel());
      await settle(sh.animate([{opacity:0}, {opacity:1}], {duration:200}), 200);
    } else {
      crinkle();
      const g = fold(sh);
      sh.classList.add('busy');
      sh.style.transformOrigin = `${g.cx}px ${g.cy}px`;
      c = addCreases(sh, g);
      c.animate([{opacity:0}, {opacity:0, offset:.16}, {opacity:.9, offset:.55}, {opacity:1}], {duration:880, fill:'forwards'});
      const t1 = sh.animate(g.tf, {duration:880, easing:'cubic-bezier(.45,0,.35,1)', fill:'forwards'});
      const t2 = sh.animate(g.cf, {duration:880, easing:'cubic-bezier(.45,0,.35,1)', fill:'forwards'});
      if (lift) lift.cancel();
      // the ball fades in over the last moments of the squeeze, so the page turns into it instead of swapping
      ball = makeBall(g.BALL, g.center, tintOf(saved));
      ball.animate([{opacity:0, transform:'scale(.9)'}, {opacity:0, transform:'scale(.9)', offset:.74}, {opacity:1, transform:'scale(1)'}],
        {duration:880, easing:'cubic-bezier(.45,0,.35,1)'});
      await settle([t1, t2], 880);
      sh.style.visibility = 'hidden';
      sh.getAnimations().forEach(a => a.cancel());
      c.remove(); c = null; sh.classList.remove('busy');
      const to = binMouth(), fr = arc(g.center, to, 540);
      const last = fr[fr.length - 1].transform;
      fr.push({transform:last.replace(/translate\(([^,]+),([^)]+)\)/, (m, x, y) => `translate(${x},${(parseFloat(y) + 16).toFixed(1)}px)`).replace(/scale\([^)]+\)/, 'scale(.42)'), opacity:0});
      fr.forEach((f, i) => { f.offset = i < fr.length - 1 ? i / (fr.length - 1) * .9 : 1; });
      await settle(ball.animate(fr, {duration:720, easing:'linear', fill:'forwards'}), 720);
      ball.remove(); ball = null;
      showTrash(); wiggle();
      paintAll();
      sh.style.visibility = '';
      await settle(sh.animate([{opacity:0, transform:'translateY(-22px) scale(.985)'}, {opacity:1, transform:'none'}],
        {duration:420, easing:'cubic-bezier(.2,.7,.2,1)'}), 420);
    }
  } finally {
    if (ball) ball.remove();
    if (c) c.remove();
    sh.getAnimations().forEach(a => a.cancel());
    sh.style.visibility = ''; sh.style.transformOrigin = '';
    sh.classList.remove('busy'); sh.inert = false;
    paintAll(); showTrash();
    busy = false;
  }
  say(`${label} page thrown away. Take it back is above the basket.`);
  foldSoon(600);
}

async function takeBack(){
  if (busy || armed || !S.trash) return;
  busy = true;
  setTray(true);
  const t = S.trash, sh = byId(t.id.split('.')[0]), hadFocus = document.activeElement === oops;
  if (PAPER.reveal) PAPER.reveal(t.id);       // bring a tossed tab page to the front before it comes back
  S.trash = null; showTrash();
  sheetKeys(t.id).forEach(k => delete S.f[k]);
  Object.assign(S.f, t.saved);
  dirty = true; persist();
  sh.inert = true;
  let ball = null, c = null;
  try {
    const r0 = sh.getBoundingClientRect();
    if (r0.bottom < 80 || r0.top > innerHeight - 80) sh.scrollIntoView({block:'start'});
    if (REDUCED){ paintAll(); }
    else {
      await settle(sh.animate([{opacity:1}, {opacity:0}], {duration:160, fill:'forwards'}), 160);
      sh.style.visibility = 'hidden';
      sh.getAnimations().forEach(a => a.cancel());
      paintAll();
      const g = fold(sh), from = binMouth();
      ball = makeBall(g.BALL, from, tintOf(t.saved));
      // fly from the basket back to the middle of the page, growing as it comes closer
      const back = arc(from, g.center, -540).map((f, i, a) => ({transform:f.transform.replace(/scale\([^)]+\)/, `scale(${(.55 + .45 * i / (a.length - 1)).toFixed(3)})`)}));
      await settle(ball.animate(back, {duration:600, easing:'linear', fill:'forwards'}), 600);
      ball.remove(); ball = null;
      sh.classList.add('busy');
      sh.style.transformOrigin = `${g.cx}px ${g.cy}px`;
      sh.style.visibility = '';
      c = addCreases(sh, g);
      c.animate([{opacity:1}, {opacity:.9, offset:.45}, {opacity:0, offset:.84}, {opacity:0}], {duration:820, fill:'forwards'});
      const t1 = sh.animate(reverse(g.tf), {duration:820, easing:'cubic-bezier(.45,0,.35,1)'});
      const t2 = sh.animate(reverse(g.cf), {duration:820, easing:'cubic-bezier(.45,0,.35,1)'});
      await settle([t1, t2], 820);
    }
  } finally {
    if (ball) ball.remove();
    if (c) c.remove();
    sh.getAnimations().forEach(a => a.cancel());
    sh.style.visibility = ''; sh.style.transformOrigin = '';
    sh.classList.remove('busy'); sh.inert = false;
    paintAll();
    busy = false;
  }
  say(`${scopeOf(sh).label} page is back.`);
  foldSoon(600);
  if (hadFocus || document.activeElement === document.body) basket.focus({preventScroll:true});
}
oops.addEventListener('click', takeBack);
showTrash();

// ---------------- the tray folds into a pencil on phones ----------------
// so it never sits on the paper while reading; it opens on a tap and folds again after use, on scroll or a tap away
const tTray = document.getElementById('t-tray'), trayLabel = document.getElementById('trayLabel');
const NARROW = matchMedia('(max-width: 999px)');
let trayOpen = true, trayY = 0;
function setTray(open){
  trayOpen = !!open || !NARROW.matches;
  tools.classList.toggle('foldable', NARROW.matches);
  tools.classList.toggle('collapsed', !trayOpen);
  tTray.setAttribute('aria-expanded', trayOpen ? 'true' : 'false');
  trayLabel.textContent = trayOpen ? 'hide' : 'tools';
  if (!trayOpen){ closeFan(false); closeMenu(false); }
  trayY = scrollY;
}
const idle = () => !armed && !busy && fan.hidden && menu.hidden && !pendingCopy;
function foldSoon(ms){ if (NARROW.matches) setTimeout(() => { if (trayOpen && idle()) setTray(false); }, ms || 0); }
tTray.addEventListener('click', e => { e.stopPropagation(); setTray(!trayOpen); });
if (NARROW.addEventListener) NARROW.addEventListener('change', () => setTray(false)); else NARROW.addListener(() => setTray(false));
addEventListener('scroll', () => { if (trayOpen && NARROW.matches && Math.abs(scrollY - trayY) > 80 && idle()) setTray(false); }, {passive:true});
document.addEventListener('pointerdown', e => { if (trayOpen && NARROW.matches && !tools.contains(e.target) && idle()) setTray(false); }, true);
setTray(false);
})();
</script>
